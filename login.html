<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Code Hunt Technology</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: #1a1a1a;
            padding: 30px;
            width: 350px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #ff6a00;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: none;
        }
        button {
            padding: 12px 20px;
            background: #ff6a00;
            color: #111;
            border: none;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Test Account Login</h2>
        <p>Use the credentials provided in your Shopee application.</p>

        <input id="user" placeholder="Username" type="text">
        <input id="pass" placeholder="Password" type="password">

        <button onclick="login()">Login</button>
    </div>

    <script>
        function login() {
            let u = document.getElementById("user").value;
            let p = document.getElementById("pass").value;

            if (u === "shopee_test" && p === "123456") {
                window.location.href = "dashboard.html";
            } else {
                alert("Invalid credentials.");
            }
        }
    </script>
</body>
</html>
