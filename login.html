<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Code Hunt Technology</title>

  <style>
    :root {
      --bg-color: #0d0d0d;
      --text-color: #f1f1f1;
      --secondary-text: #ccc;
      --accent: #ff6600;
      --card-bg: #111;
      --btn-bg: #ff6600;
      --btn-hover: #ff8533;
    }

    body.light {
      --bg-color: #ffffff;
      --text-color: #111111;
      --secondary-text: #555555;
      --accent: #ff6600;
      --card-bg: #f5f5f5;
      --btn-bg: #111111;
      --btn-hover: #333333;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: 0.4s;
    }

    .login-box {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 8px;
      width: 360px;
      text-align: center;
      border: 1px solid var(--accent);
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #1d1d1d;
      color: #fff;
      font-size: 1rem;
    }

    input.light {
      background: #e9e9e9;
      color: #111;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: var(--btn-bg);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      font-size: 1rem;
    }

    button:hover {
      background: var(--btn-hover);
      transform: scale(1.03);
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--btn-bg);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <button class="theme-toggle" onclick="toggleTheme()">☀️ Light Mode</button>

  <div class="login-box">
    <h2>Code Hunt Test Login</h2>
    <p>Use the credentials provided in the Shopee application.</p>

    <input id="email" type="text" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Access Demo</button>
  </div>

  <script>
    function toggleTheme() {
      const body = document.body;
      const inputs = document.querySelectorAll("input");
      const button = document.querySelector(".theme-toggle");

      body.classList.toggle("light");

      if (body.classList.contains("light")) {
        button.textContent = "🌙 Dark Mode";
        inputs.forEach(el => el.classList.add("light"));
      } else {
        button.textContent = "☀️ Light Mode";
        inputs.forEach(el => el.classList.remove("light"));
      }
    }

    function login() {
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (email === "demo@codehunt.com" && pass === "123456") {
        window.location.href = "dashboard.html";
      } else {
        alert("Invalid credentials.");
      }
    }
  </script>
</body>
</html>
